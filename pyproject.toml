[project]
name = "cnn-accelerator"
version = "0.1.0"
description = "MNIST CNN training and integer reference for a Zynq accelerator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
